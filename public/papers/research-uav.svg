    <pattern id="fine" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#c7ab73" stroke-opacity=".2"/></pattern>
    <clipPath id="terrain"><rect x="42" y="101" width="334" height="211" rx="12"/></clipPath>
