type = "card"
title = "研究"
description = "探索生成模型的数据利用、表示与泛化，并将这些认识用于视觉学习与智能体协作。"

[[items]]
title = "理解与缓解模型坍塌"
subtitle = "NeurIPS 2025 · Spotlight · 共同一作"
content = "从泛化向记忆的转变解释扩散模型坍塌，并通过基于熵的数据选择改善递归训练。\n\n[论文](https://arxiv.org/abs/2509.16499) · [项目主页](https://shilianghe007.github.io/model-collapse/index.html) · [代码](https://github.com/shilianghe007/Model_Collapse)"
tags = ["扩散模型","泛化与记忆"]
image = "/images/research-collapse.svg"

[[items]]
title = "扩散模型的表示与泛化"
subtitle = "ICLR 2026 · Poster"
content = "研究平衡表示与局部尖峰表示如何区分泛化和记忆，并探索记忆检测及表示引导编辑。\n\n[论文](https://arxiv.org/abs/2512.20963) · [项目主页](https://la0ka1.github.io/diffusion-gen-from-rep/) · [代码](https://github.com/la0ka1/diffusion-gen-from-rep)"
tags = ["扩散模型","泛化与记忆"]
image = "/images/research-representation.svg"

[[items]]
title = "无人机视觉的合成到真实迁移"
subtitle = "CFHA · 公开预印本"
content = "通过全局风格迁移、局部细化和幻觉移除，改善合成无人机图像与真实场景之间的对齐。\n\n[论文](https://arxiv.org/abs/2512.13869) · [代码](https://github.com/liwd190019/CFHA)"
tags = ["合成数据","视觉学习"]
image = "/images/research-uav.svg"

[[items]]
title = "多模态驱动的可控图像外扩"
subtitle = "VIP · ACCV 2024"
content = "结合多模态大语言模型的语义描述与扩散生成，按用户需求扩展图像周围内容。\n\n[论文](https://openaccess.thecvf.com/content/ACCV2024/html/Yang_VIP_Versatile_Image_Outpainting_Empowered_by_Multimodal_Large_Language_Model_ACCV_2024_paper.html) · [代码](https://github.com/ucasyjz/VIP)"
tags = ["多模态生成","图像外扩"]
image = "/images/research-multimodal.svg"

[[items]]
title = "异构智能体的潜在通信"
subtitle = "See What I See · 2026 预印本"
content = "通过稠密 KV 缓存对齐，研究不同语言模型之间共享上下文和推理信息的方法。\n\n[论文](https://arxiv.org/abs/2606.13594) · [项目主页](https://chicychen.github.io/dense-hetero-latent-mas/)"
tags = ["异构智能体","潜在通信"]
image = "/images/research-agents.svg"
