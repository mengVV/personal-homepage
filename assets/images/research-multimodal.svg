  <text x="32" y="375" fill="#6f747d" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.6">CONCEPT STUDY</text>
  <path d="M568 369H608" stroke="#f1ca7e" stroke-width="2"/>
